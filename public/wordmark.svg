<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.4 -93.3 391.5 133.2" role="img" aria-label="Kalyanam">
  <!-- The name "Kalyanam", one shape per letter. On the loading screen each letter
       is drawn as a line, one after the other like handwriting, and then fills
       with colour. The letter shapes come from the Great Vibes font
       (SIL Open Font License). -->
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="378" y2="0">
      <stop offset="0" stop-color="#B0344C"/>
      <stop offset="0.55" stop-color="#D9536E"/>
      <stop offset="1" stop-color="#EE8CA0"/>
    </linearGradient>
  </defs>
  <style>
    /* Two animations on each letter: first its line is drawn, then it fills.
       --d is the moment a letter starts, in seconds. Each letter starts a
       little later than the one before it. */
    path {
      fill: url(#ink);
      fill-opacity: 0;
      stroke: url(#ink);
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 0.4s ease-out forwards, fill 0.3s ease-out forwards;
      animation-delay: calc(var(--d) * 1s), calc(var(--d) * 1s + 0.25s);
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    }
  </style>
