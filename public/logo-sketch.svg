<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" fill="none">
  <!-- The outline of the logo as lines. The loading screen shows this file first:
       the lines are drawn like a pen sketch, then the coloured logo fades in on top.
       Made by tracing public/logo.webp. -->
  <style>
    /* pathLength="1" makes every line count as length 1. A dash of length 1 that is
       pushed away by 1 hides the line. Moving the push back to 0 draws it. */
    path {
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: calc(var(--d) * 1s);
    }
    .pink { stroke: #E8798F; }
    .green { stroke: #6E9E45; }
    /* when the coloured logo has arrived, the sketch fades away */
    g { animation: leave 0.6s ease 1.85s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes leave { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      path, g { animation: none; }
      g { opacity: 0; }
    }
  </style>
